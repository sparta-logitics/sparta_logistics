spring:
  application:
    name: api-gateway
  profiles:
    active: local
  config:
    import: "configserver:"
  cloud:
    config:
      discovery:
        enabled: true
        service-id: config-server
      # ★★★ 재시도 관련 설정 추가 ★★★
      fail-fast: true
      retry:
        enable: true
        max-attempts: 30    # 최대 30회 시도 (기본 6회)
        initial-interval: 2000 # 초기 간격 1초
        max-interval: 3000  # 최대 간격 2초


eureka:
  client:
    service-url:
      defaultZone: ${EUREKA_DEFAULT_ZONE}