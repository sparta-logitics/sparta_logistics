# 모든 Config Client 서비스에 공통 적용
spring:
  application:
    # 각 서비스에 맞게 이름 변경 필요 (예: api-gateway, delivery-server, hub-service)
    name: delivery-service
  profiles:
    active: local
  config:
    import: "configserver:" # Config Server 사용 활성화
  cloud:
    config:
      discovery:
        enabled: true
        service-id: config-server # 유레카에 등록된 Config Server를 찾도록 지시
      fail-fast: true
      retry:
        enable: true
        max-attempts: 30    # 최대 30회 시도 (기본 6회)
        initial-interval: 2000 # 초기 간격 1초
        max-interval: 3000  # 최대 간격 2초

eureka:
  client:
    service-url:
      defaultZone: ${EUREKA_DEFAULT_ZONE} # Docker Compose에서 주입받음

