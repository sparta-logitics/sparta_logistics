# src/test/resources/application.yml
spring:
  datasource:
    url: jdbc:h2:mem:testdb;DB_CLOSE_DELAY=-1
    driverClassName: org.h2.Driver
    username: sa
    password:
  jpa:
    hibernate:
      ddl-auto: create-drop
    show-sql: true
    properties:
      hibernate.format_sql: true
  cloud:
    config:
      enabled: false

# Eureka/Feign 비활성화
eureka:
  client:
    register-with-eureka: false
    fetch-registry: false

feign:
  client:
    config:
      default:
        url: http://localhost   # 임시 URL

AI-SERVICE_RIBBON_LISTOFSERVERS: http://localhost
HUB-SERVICE_RIBBON_LISTOFSERVERS: http://localhost